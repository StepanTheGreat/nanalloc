[package]
name = "nanalloc"
version = "0.1.0"
edition = "2024"

[features]
size_test = []
default = []

[lib]
crate-type = ["rlib", "cdylib"]

[profile.dev]
overflow-checks = false
panic = "abort"

[profile.release]
overflow-checks = false
strip = false
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"